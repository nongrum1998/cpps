packages:
  - "apps/*"
  - "packages/*"

# Disable pnpm's hidden hoist (`node_modules/.pnpm/node_modules`).
#
# This workspace intentionally holds two React Native majors at once:
# apps/cpps + apps/pension on Expo 57 / RN 0.86.x, and apps/eis on
# Expo 54 / RN 0.81.x. By default pnpm hoists every transitive dependency into
# a single store-wide `node_modules/.pnpm/node_modules` directory, which is
# shared by all importers. Any package that imports something it does not
# declare resolves it from that shared directory — so a lookup originating
# inside a hoisted package can silently cross from one app into the other
# app's SDK generation.
#
# Metro makes this reachable in practice because it resolves an import by
# walking up from the *importing file* before consulting the app's own
# `node_modules`, and pnpm gives a package's own dependencies first refusal.
# So an import that no package in the chain declares lands in the shared
# hoist. Observed in apps/eis (Expo 54) resolving, via the hoist:
#   react-native@0.86.3, expo-constants@57.0.20, react-native-css-interop@0.2.6
# which then failed Metro codegen with "Unable to determine event arguments
# for onModeChange".
#
# With hoisting off, a package resolves only what its own manifest declares
# (its own `node_modules` plus, for app code, the app's `node_modules` via
# Metro's `nodeModulesPaths`). A missing declaration becomes a hard resolution
# error instead of a silent cross-SDK import, which is the behaviour we want.
hoist: false
hoistPattern: []

# pnpm blocks native module postinstall scripts by default (v10+).
# Whitelist the ones the workspace actually needs.
allowBuilds:
  # tsx (required by apps/*/app.config.ts to import workspace TypeScript)
  # transpiles via esbuild, whose postinstall pnpm 10+ blocks by default.
  esbuild: true
  unrs-resolver: true

# Pinned overrides previously living in apps/pension/pnpm-workspace.yaml.
overrides:
  fastq: 1.20.2
  string.prototype.matchall: 4.0.12

packageExtensions:
  # nativewind@4.2.3 omits `react-native` from its peerDependencies even though
  # it imports React Native at runtime. With two RN majors in this workspace
  # (apps/cpps + apps/pension on 0.86.x, apps/eis on 0.81.x) pnpm cannot link a
  # per-importer copy for nativewind, so its own `require('react-native')` has
  # nothing to resolve to. Declaring the missing peer makes pnpm bind each
  # importer to its own react-native. This complements `hoist: false` above:
  # hoisting off stops cross-app leakage, and this extension makes nativewind
  # declare the dependency it actually uses.
  nativewind@4.2.3:
    peerDependencies:
      react-native: '*'

# Expo SDK 57 packages published within pnpm's minimum release-age window;
# excluded so fresh installs are not blocked by the release-age policy.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.18'
  - '@expo/config-plugins@57.0.9'
  - '@expo/config@57.0.9'
  - '@expo/fingerprint@0.20.10'
  - '@expo/image-utils@0.11.5'
  - '@expo/metro-config@57.0.10'
  - '@expo/metro-file-map@57.0.2'
  - '@expo/prebuild-config@57.0.14'
  - '@expo/require-utils@57.0.5'
  - babel-preset-expo@57.0.8
  - expo-asset@57.0.14
  - expo-constants@57.0.14
  - expo-modules-autolinking@57.0.11
  - expo-modules-core@57.0.13
  - expo@57.0.16
  - '@expo/metro-runtime@57.0.13'
  - '@expo/ui@57.0.13'
  - expo-dev-client@57.0.15
  - expo-dev-launcher@57.0.15
  - expo-dev-menu@57.0.15
  - expo-notifications@57.0.14
  - expo-router@57.0.16
  - expo-splash-screen@57.0.8
  - expo-updates@57.0.17
