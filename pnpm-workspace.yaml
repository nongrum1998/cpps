packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks native module postinstall scripts by default (v10+).
# Whitelist the ones the workspace actually needs.
allowBuilds:
  unrs-resolver: true

# Pinned overrides previously living in apps/pension/pnpm-workspace.yaml.
overrides:
  fastq: 1.20.2
  string.prototype.matchall: 4.0.12

# Expo SDK 57 packages published within pnpm's minimum release-age window;
# excluded so fresh installs are not blocked by the release-age policy.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.18'
  - '@expo/config-plugins@57.0.9'
  - '@expo/config@57.0.9'
  - '@expo/fingerprint@0.20.10'
  - '@expo/image-utils@0.11.5'
  - '@expo/metro-config@57.0.10'
  - '@expo/metro-file-map@57.0.2'
  - '@expo/prebuild-config@57.0.14'
  - '@expo/require-utils@57.0.5'
  - babel-preset-expo@57.0.8
  - expo-asset@57.0.14
  - expo-constants@57.0.14
  - expo-modules-autolinking@57.0.11
  - expo-modules-core@57.0.13
  - expo@57.0.16
  - '@expo/metro-runtime@57.0.13'
  - '@expo/ui@57.0.13'
  - expo-dev-client@57.0.15
  - expo-dev-launcher@57.0.15
  - expo-dev-menu@57.0.15
  - expo-notifications@57.0.14
  - expo-router@57.0.16
  - expo-splash-screen@57.0.8
  - expo-updates@57.0.17